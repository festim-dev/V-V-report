version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "miniconda-latest"
  apt_packages:
    - libglx-mesa0
    - libgl1
    - xvfb
  jobs:
    pre_build:
      # Generate the Sphinx configuration for this Jupyter Book so it builds.
      - "jupyter-book config sphinx report/"

conda:
  environment: environment.yml

sphinx:
  builder: html
  fail_on_warning: true
  # generated by the pre_build job, see https://github.com/jupyter-book/jupyter-book/issues/2615
  configuration: report/conf.py